<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0 ">
        <link rel="icon" sizes="32x32" type="image/png" href="assets/images/favicon32.png">
        <link rel="icon" sizes="16x16" type="image/png" href="assets/images/favicon16.png">
        <link rel="stylesheet" types="text/css" href="assets/css/style.css">
        <title>Spotify - Web Player: Music for everyone</title>
    </head>
    <body>
        <nav class="navbar flex">
            <a href="index.html" class="spotify-logo">
                <img src="assets/images/logo.svg" aria-label="Spotify Logo">
            </a>
            <div class="nav-center flex">
                <button class="home-icon flex" aria-label="home_btn" type="button">
                    <img src="assets/icons/home.svg" aria-label="Home Icon" />
                </button>
                <div class="nav-search flex">
                    <div class="search-icon flex"><img src="assets/icons/search.svg" aria-label="search"/></div>
                    <div class="input  top-search"><input type="search" class="searchbar top-search" placeholder="What do you want to play?"/></div>
                    <div class="browse-icon flex"><img src="assets/icons/browse.svg" aria-label="browse" /></div>
                </div>
            </div>
            <div class="right-btn flex">
                <button type="button" class="explore-premium-btn">Explore Premium</button>
                <button type="button" class="install-btn flex" style="gap: 2px;"><span><img src="assets/icons/install.svg" /></span><span>Install App</span></button>
                <button type="button" class="notification-btn flex"><img src="assets/icons/notification.svg" /></button>
                <button type="button" class="friends-btn flex"><img src="assets/icons/friends.svg" /></button>
                <button type="button" class="profile-btn flex"><img src="assets/icons/user.svg"/></button>
            </div>
        </nav>
        <!--Main Body thingy-->
        <main>
            <!--Sidebar-->
            <aside class="sidebar flex" id="playlist-bar">
                <div class="flex" style="flex-direction: column; gap: 8px;">
                    <div class="flex title"><span>Your Library</span><img src="assets/icons/plus.svg" /></div>
                    <div class="btn flex">
                        <button type="button">Playlist</button>
                        <button type="button">Artist</button>
                    </div>
                    <div class="filters">
                        <button class="searchbar">
                            <img src="assets/icons/search.svg" id="sb_search"/>
                            <input type="search" id="sb_input" hidden>
                        </button>
                        <div class="recent">
                            <span>Recents</span>
                            <img src="assets/icons/list.svg" />
                        </div>
                    </div>
                    <div id="playlist_ctn">

                    </div>
                </div>
            </aside>
            <section class="mainbody">
                
            </section>
        </main>

        <footer class="playbar">
            <div class="details">
                <img src="https://i.pinimg.com/736x/66/7a/7f/667a7f247077806fbedd7a22e973f77f.jpg"/>
                <div class="names">
                    <div class="title">Song name</div>
                    <div class="artist">Artist</div>
                </div>
                <img class="icon" src="assets/icons/plus-circle.svg" />

            </div>
            <div class="play">
                <div class="play_controls">
                    <img src="assets/icons/shuffle.svg" />
                    <img src="assets/icons/skip-back.svg" />
                    <img src="assets/icons/pause.svg" />
                    <img src="assets/icons/skip-forward.svg" />
                    <img src="assets/icons/repeat.svg" />
                </div>
                <input class="play-range" id="bar" type="range" min="0" max="100"/>
            </div>
            <div class="controls flex" style="gap: 8px;">
                <img id="vol-icon" src="assets/icons/volume-2.svg" />
                <input class="volume" id="volume" type="range" min="0" max="100"/>
            </div>
        </footer>

        <script  src="assets/js/script.js"></script>
    </body>
</html>
